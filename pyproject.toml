[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safe-mcp-bridge-v2"
version = "0.1.0"
description = "A fail-closed stdio-to-Streamable-HTTP policy bridge for MCP 2026-07-28"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Efe Buken / Arven Digital" }]
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-httpx>=0.30,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6,<7",
]

[project.scripts]
safe-mcp-bridge-v2 = "safe_mcp_bridge_v2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/safe_mcp_bridge_v2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["safe_mcp_bridge_v2"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
